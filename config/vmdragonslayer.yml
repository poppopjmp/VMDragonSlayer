# VMDragonSlayer Development Configuration

logging:
  level: DEBUG
  file: logs/vmds_dev.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  console: true

analysis:
  timeout: 600  # 10 minutes
  max_threads: 4
  enable_caching: true

# Tracing backend configuration
# Supported backends: unicorn, triton, angr, qiling, file, auto
# "auto" probes available backends in order: unicorn → triton → angr → qiling
tracing:
  backend: auto
  timeout: 300  # 5 minutes wall-clock timeout per trace
  max_instructions: 100000
  capture_registers: true
  capture_memory: true
  trace_output_dir: traces/

  # Per-backend settings (optional, override defaults when that backend is active)
  unicorn:
    follow_calls: true
  triton:
    symbolic: true
    taint: true
  angr:
    auto_load_libs: false
  qiling:
    rootfs: ""           # Qiling rootfs path (e.g. "rootfs/x86_linux")
    multithread: false

api:
  host: 127.0.0.1
  port: 8000
  workers: 2
  enable_cors: true
  debug: true

vmprotect:
  trace_depth: 100000
  enable_symbolic: true
  llvm_opt_level: O3
  skip_optimization: false
  validation_threshold: 0.85
  confidence_threshold: 0.8
  max_handler_size: 10000

# Dispatcher finder configuration (B102)
dispatcher:
  max_trace_length: 500000   # Traces longer than this are subsampled
  early_exit_confidence: 0.9 # Skip remaining finders above this threshold

# Symbolic execution engine limits (B53)
symbolic_execution:
  solver_timeout_ms: 10000   # Z3 per-query timeout
  max_paths: 64              # Maximum concurrent paths
  max_depth: 1000            # Max instructions per path
  max_loop_iters: 3          # Loop iterations before widening
  memory_limit_mb: 2048      # Z3 global memory cap

data:
  patterns_db: data/patterns/vmprotect_handlers.json
  models_dir: data/models/
  samples_dir: data/samples/
  schemas_dir: data/schemas/

paths:
  workspace_root: .
  logs_dir: logs/
  temp_dir: temp/
  output_dir: output/
