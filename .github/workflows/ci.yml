name: CI

on:
  push:
    branches: [main, dev-*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 03:00 UTC


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests with coverage
        run: |
          python -m pytest --tb=short -q --cov=dragonslayer --cov-report=term-missing --cov-fail-under=80

  # Exercises the dynamic-analysis path that the core 'test' job cannot:
  # installs the built-in Unicorn trace backend and runs the end-to-end
  # devirtualization test over a real compiled bytecode-VM ELF.
  emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install deps + Unicorn backend + ML
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "unicorn>=2.0.1" "keystone-engine>=0.9.2" "pefile>=2024.8.26"
          pip install "scikit-learn>=1.3.0" "joblib>=1.3.0"
          pip install -e .

      - name: Run end-to-end emulation/devirt + ML classifier tests
        # The Triton/angr/qiling-specific tests skip unless those heavier
        # backends are installed; the Unicorn-driven trace, jump-table
        # dispatcher detection, full devirt-pipeline, and ML synthetic
        # classifier tests run here.
        run: |
          python -m pytest tests/test_e2e_vm_sample.py \
            tests/test_e2e_dynamic_backends.py \
            tests/test_ml_synthetic_classifier.py \
            tests/test_generic_vm.py -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install linters
        run: pip install ruff

      - name: Ruff check
        run: ruff check dragonslayer/ --select E,W,F,B,UP,SIM,I,C4 --ignore E501

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install mypy
          pip install -e .

      - name: Mypy
        run: mypy dragonslayer/ --ignore-missing-imports --warn-return-any --warn-unused-configs --disallow-untyped-defs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit (SAST)
        run: bandit -r dragonslayer/ -c pyproject.toml -ll

      - name: pip-audit (dependency scan)
        run: pip-audit -r requirements.txt
