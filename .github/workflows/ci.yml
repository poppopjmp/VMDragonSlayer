name: CI

on:
  push:
    branches: [main, dev-*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests with coverage
        run: |
          python -m pytest --tb=short -q --cov=dragonslayer --cov-report=term-missing --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install linters
        run: pip install ruff

      - name: Ruff check
        run: ruff check dragonslayer/ --select E,W,F,B,UP,SIM,I,C4 --ignore E501

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install mypy
          pip install -e .

      - name: Mypy
        run: mypy dragonslayer/ --ignore-missing-imports --warn-return-any --warn-unused-configs --disallow-untyped-defs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit (SAST)
        run: bandit -r dragonslayer/ -c pyproject.toml -ll

      - name: pip-audit (dependency scan)
        run: pip-audit -r requirements.txt
